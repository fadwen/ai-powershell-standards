name: Dependency versions

# Looks up, twice a month, whether the modules and tools that this repository pins have a newer
# release, and opens an issue that lists them, or updates the one that is open. Once every pin is
# current, a run that succeeds closes that issue. A lookup that fails still lets the pins that were
# found reach the issue, then fails the run. The pins, and the
# text in each file that holds one, are in Tools/Dependencies.psd1. The GitHub Actions in
# .github/workflows are left to Dependabot (.github/dependabot.yml), which opens a pull request.
#
# This opens an issue and not a pull request because a rule that names a version says what was
# measured on it. A claim is tested again on the new release before the pin and the rule move.
#
# GitHub sends a notice when a scheduled run fails to the person who last changed the schedule.

on:
  schedule:
    # The 1st and the 15th of every month, 05:23 UTC.
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Look up the latest releases
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.find.outputs.report }}
      failure: ${{ steps.find.outputs.failure }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the pins that have a newer release
        id: find
        shell: pwsh
        env:
          # Raises the rate limit of the GitHub API, which a shared runner can reach without it.
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $updates = [System.Collections.Generic.List[object]]::new()
          $lookupError = $null
          try {
              ./Tools/Find-DependencyUpdate.ps1 | ForEach-Object -Process { $updates.Add($_) }
          } catch {
              # The updates that were found before the failure still go into the report. The step
              # fails once the report is written.
              $lookupError = $_
          }
          $updates | Format-Table -Property Name, Pinned, Latest -AutoSize | Out-String | Write-Output

          # The table and the failure are two outputs, so that a failure alone does not replace
          # the table of the open issue.
          $report = ''
          if ($updates.Count -gt 0) {
              $rows = foreach ($update in $updates) {
                  $files = ($update.PinnedIn | ForEach-Object { "``$_``" }) -join ', '
                  $latest = if ($update.MovesCommit) { "$($update.Latest), with its commit" } else { "$($update.Latest)" }
                  '| {0} | {1} | {2} | {3} |' -f $update.Name, $update.Pinned, $latest, $files
              }
              $table = @('| Pin | Pinned | Latest | Pinned in |', '| --- | --- | --- | --- |') + $rows
              $report = (@('These pins have a newer release:', '') + $table) -join "`n"
          }
          $failure = ''
          if ($null -ne $lookupError) {
              $failure = "Some pins could not be looked up, so this list may be incomplete. $($lookupError.Exception.Message)"
          }

          $delimiter = "REPORT_$([guid]::NewGuid().ToString('N'))"
          $lines = "report<<$delimiter", $report, $delimiter, "failure<<$delimiter", $failure, $delimiter
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $lines -Encoding utf8
          if ($null -ne $lookupError) {
              throw $lookupError
          }

  report:
    name: Open, update, or close the issue
    needs: check
    # Also after a failed lookup, so that the pins that were found still reach the issue.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Only this job may write, and only issues. It checks nothing out.
    permissions:
      issues: write

    steps:
      - name: Write the issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ needs.check.outputs.report }}
          FAILURE: ${{ needs.check.outputs.failure }}
          CHECK_RESULT: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $title = 'Newer releases of pinned dependencies'
          $found = & gh issue list --state open --search "$title in:title" --json number,title
          if ($LASTEXITCODE -ne 0) {
              throw "gh issue list failed with exit code $LASTEXITCODE."
          }
          $open = @($found | ConvertFrom-Json | Where-Object { $_.title -eq $title })

          if ([string]::IsNullOrWhiteSpace($env:REPORT)) {
              # An empty report means that every pin is current only when the check succeeded. A
              # check that failed, with no newer release found, leaves the issue as it is: the
              # failed run says why.
              if ($env:CHECK_RESULT -eq 'success' -and $open.Count -gt 0) {
                  & gh issue close $open[0].number --comment "Every pin is current, as $env:RUN_URL found."
                  if ($LASTEXITCODE -ne 0) {
                      throw "gh could not close the issue. Exit code $LASTEXITCODE."
                  }
              }
              return
          }

          $failureParagraph = if ([string]::IsNullOrWhiteSpace($env:FAILURE)) { @() } else { $env:FAILURE, '' }
          $body = @(
              $env:REPORT
              ''
              $failureParagraph
              'A version that a rule names is often the one that a statement was measured on. Test each such statement again on the new release before it moves.'
              ''
              'Then move the pin in `Tools/Dependencies.psd1` and in each file of the last column. Those are the places that install or require the version. Search for the old version, for example with `git grep -n -F ''<pinned version>''`, to find the other mentions. For an action that moves with its commit, look up the commit of the new tag and change it as well.'
              ''
              "Found by $env:RUN_URL"
          ) -join "`n"
          if ($open.Count -gt 0) {
              & gh issue edit $open[0].number --body $body
          } else {
              & gh issue create --title $title --body $body --label enhancement
          }
          if ($LASTEXITCODE -ne 0) {
              throw "gh could not write the issue. Exit code $LASTEXITCODE."
          }

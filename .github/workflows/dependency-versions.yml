name: Dependency versions

# Looks up, twice a month, whether the modules and tools that this repository pins have a newer
# release, and keeps one issue open for each pin that is behind, titled "Move the <pin> pin to
# <version>". Each pin gets its own issue, because one release can take longer to test than
# another. When a still newer release comes out, the open issue moves to it. Once the pin is
# current, a run that succeeds closes the issue. A lookup that fails still lets the pins that were
# found reach their issues, closes none, and fails the run.
#
# The pins, and the text in each file that holds one, are in Tools/Dependencies.psd1. The GitHub
# Actions in .github/workflows are left to Dependabot (.github/dependabot.yml), which opens a pull
# request.
#
# This opens issues and not pull requests because a rule that names a version says what was
# measured on it. A claim is tested again on the new release before the pin and the rule move.
#
# GitHub sends a notice when a scheduled run fails to the person who last changed the schedule.

on:
  schedule:
    # The 1st and the 15th of every month, 05:23 UTC.
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Look up the latest releases
    runs-on: ubuntu-latest
    outputs:
      updates: ${{ steps.find.outputs.updates }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the pins that have a newer release
        id: find
        shell: pwsh
        env:
          # Raises the rate limit of the GitHub API, which a shared runner can reach without it.
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $updates = [System.Collections.Generic.List[object]]::new()
          $lookupError = $null
          try {
              ./Tools/Find-DependencyUpdate.ps1 | ForEach-Object -Process { $updates.Add($_) }
          } catch {
              # The updates that were found before the failure still reach their issues. The
              # step fails once they are written.
              $lookupError = $_
          }
          $updates | Format-Table -Property Name, Pinned, Latest -AutoSize | Out-String | Write-Output

          $records = foreach ($update in $updates) {
              [PSCustomObject]@{
                  Name = $update.Name
                  Pinned = $update.Pinned
                  Latest = $update.Latest.ToString()
                  PinnedIn = @($update.PinnedIn)
                  MovesCommit = $update.MovesCommit
              }
          }
          $json = ConvertTo-Json -InputObject @($records) -Compress -Depth 3
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "updates=$json" -Encoding utf8
          if ($null -ne $lookupError) {
              throw $lookupError
          }

  report:
    name: Open, update, or close the issues
    needs: check
    # Also after a failed lookup, so that the pins that were found still reach their issues.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Only this job may write, and only issues. It checks nothing out.
    permissions:
      issues: write

    steps:
      - name: Write one issue for each pin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATES: ${{ needs.check.outputs.updates }}
          CHECK_RESULT: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $updates = if ([string]::IsNullOrWhiteSpace($env:UPDATES)) { @() } else { @($env:UPDATES | ConvertFrom-Json) }

          # Only the issues that this workflow opened are read, updated, or closed. gh finds them
          # by the login github-actions[bot]; app/github-actions, as GitHub shows it, finds none.
          $titlePattern = '^Move the (.+) pin to \S+$'
          $listing = @('issue', 'list', '--state', 'open', '--author', 'github-actions[bot]', '--limit', '200')
          $found = & gh @listing --json 'number,title'
          if ($LASTEXITCODE -ne 0) {
              throw "gh issue list failed with exit code $LASTEXITCODE."
          }
          $open = @($found | ConvertFrom-Json | Where-Object { $_.title -match $titlePattern })
          $openByPin = @{}
          foreach ($issue in $open) {
              $null = $issue.title -match $titlePattern
              $openByPin[$Matches[1]] = $issue.number
          }

          foreach ($update in $updates) {
              $title = "Move the $($update.Name) pin to $($update.Latest)"
              $files = ($update.PinnedIn | ForEach-Object { "- ``$_``" }) -join "`n"
              $commit = if ($update.MovesCommit) {
                  @("This action is pinned by its commit. Look up the commit of the tag ``v$($update.Latest)``, and change it with the version.", '')
              } else {
                  @()
              }
              $body = @(
                  "$($update.Name) $($update.Latest) is released. This repository pins $($update.Pinned)."
                  ''
                  'The places that install or require the version:'
                  ''
                  $files
                  ''
                  $commit
                  'A version that a rule names is often the one that a statement was measured on. Test each such statement again on the new release before it moves.'
                  ''
                  "Then move the pin in ``Tools/Dependencies.psd1`` and in each file above. Search for the old version, for example with ``git grep -n -F '$($update.Pinned)'``, to find the other mentions."
                  ''
                  "Found by $env:RUN_URL"
              ) -join "`n"

              if ($openByPin.ContainsKey($update.Name)) {
                  & gh issue edit $openByPin[$update.Name] --title $title --body $body
              } else {
                  & gh issue create --title $title --body $body --label enhancement
              }
              if ($LASTEXITCODE -ne 0) {
                  throw "gh could not write the issue for $($update.Name). Exit code $LASTEXITCODE."
              }
          }

          # A pin without an update is current only when the check succeeded. After a failed
          # check the issues stay open: the failed run says why.
          if ($env:CHECK_RESULT -ne 'success') {
              return
          }
          $behind = @($updates | ForEach-Object { $_.Name })
          foreach ($pin in $openByPin.Keys) {
              if ($pin -notin $behind) {
                  & gh issue close $openByPin[$pin] --comment "The $pin pin is current, as $env:RUN_URL found."
                  if ($LASTEXITCODE -ne 0) {
                      throw "gh could not close the issue for $pin. Exit code $LASTEXITCODE."
                  }
              }
          }

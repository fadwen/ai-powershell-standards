name: Credential scan (monthly)

# Scans every commit of every branch and tag, and the files of the checkout, with trufflehog,
# once a month. credential-scan.yml runs betterleaks on every pull request and every push to
# main. trufflehog reports by the form of a key of a known service and has other detectors than
# betterleaks has rules, so it is a second reader of the same history.
#
# The scan is Tools/Invoke-CredentialScan.ps1. It runs trufflehog with --no-verification, so
# that nothing it finds is sent to a service, and it never writes a value to this log. It
# leaves out the findings whose fingerprints are in .trufflehogignore and says how many.
#
# The scanner is pinned by its version and by the SHA256 of its release archive for the runner,
# as the checksum file of that release gives it. Change the two together, with the values that
# the script holds: a test compares them.
#
# A run that fails names each place. Read it as the powershell-credential-scan skill says: a real
# credential is revoked first, and a fingerprint goes into .trufflehogignore only for a value
# that was read and is not a credential.

on:
  schedule:
    # The first day of every month, 04:17 UTC.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# The names of these values hold no word such as credential, key, or token. Beside a long
# value, a scanner takes such a name for the name of a key, and reports the hash below.
env:
  SCANNER_VERSION: '3.99.9'
  SCANNER_SHA256: '12050095c8063bf4d34f9f6cbce6ba9fa8d0deea9d503d0570364feba093658e'

jobs:
  credentials:
    name: Credential scan with trufflehog
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history and the files with trufflehog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scan = @{
              Scanner = 'trufflehog'
              Version = $env:SCANNER_VERSION
              Sha256 = $env:SCANNER_SHA256
          }
          ./Tools/Invoke-CredentialScan.ps1 @scan

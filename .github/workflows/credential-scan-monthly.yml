name: Credential scan (monthly)

# Scans every commit of every branch and tag, and the files of the checkout, with trufflehog,
# once a month. credential-scan.yml runs betterleaks on every pull request and every push to
# main. trufflehog reports by the form of a key of a known service and has other detectors than
# betterleaks has rules, so it is a second reader of the same history.
#
# The scan is Tools/Invoke-CredentialScan.ps1. It runs trufflehog with --no-verification, so
# that nothing it finds is sent to a service, and it never writes a value to this log. It
# leaves out the findings whose fingerprints are in .trufflehogignore and says how many.
#
# The scanner is pinned by its version and by the SHA256 of its release archive for the runner,
# as the checksum file of that release gives it. Change the two together, with the values that
# the script holds: a test compares them.
#
# A run that fails names each place. Read it as the powershell-credential-scan skill says: a real
# credential is revoked first, and a fingerprint goes into .trufflehogignore only for a value
# that was read and is not a credential.
#
# No pull request shows the result of this run, so a failed scan opens an issue that links to
# the run, or adds a comment to that issue while it is open. The issue names no place: the run
# does. A scan fails for a finding and also when it could not run, and the issue says so.

on:
  schedule:
    # The first day of every month, 04:17 UTC.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# The names of these values hold no word such as credential, key, or token. Beside a long
# value, a scanner takes such a name for the name of a key, and reports the hash below.
env:
  SCANNER_VERSION: '3.100.1'
  SCANNER_SHA256: 'b2460688116f29ce33f1afe16d14fef3fa3db928e74ba55a6c9fed392c60ad69'

jobs:
  credentials:
    name: Credential scan with trufflehog
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history and the files with trufflehog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scan = @{
              Scanner = 'trufflehog'
              Version = $env:SCANNER_VERSION
              Sha256 = $env:SCANNER_SHA256
          }
          ./Tools/Invoke-CredentialScan.ps1 @scan

  report:
    name: Open an issue for a failed scan
    needs: credentials
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    # Only this job may write, and only issues. It checks nothing out and runs no scanner.
    permissions:
      issues: write

    steps:
      - name: Open an issue, or add to the one that is open
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $title = 'The monthly credential scan failed'
          $body = @(
              "The scan of this repository with trufflehog failed: $env:RUN_URL"
              ''
              'The log of that run names each place that was reported, or says why the scan could not run.'
              'It holds no value. Read a finding as CONTRIBUTING.md says: a real credential is revoked first.'
          ) -join "`n"

          $found = & gh issue list --state open --search "$title in:title" --json number,title
          if ($LASTEXITCODE -ne 0) {
              throw "gh issue list failed with exit code $LASTEXITCODE."
          }
          $open = @($found | ConvertFrom-Json | Where-Object { $_.title -eq $title })
          if ($open.Count -gt 0) {
              & gh issue comment $open[0].number --body $body
          } else {
              & gh issue create --title $title --body $body
          }
          if ($LASTEXITCODE -ne 0) {
              throw "gh could not write the issue. Exit code $LASTEXITCODE."
          }

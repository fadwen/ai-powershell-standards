name: Credential scan

# Scans every commit of every branch and tag, and the files of the checkout, for credentials
# with betterleaks. A credential that was committed stays in the repository after the commit
# that removes it, so the scan reads the history and not only the files (CIC-23).
#
# The scan is Tools/Invoke-CredentialScan.ps1, the script that the standards install into a
# project, with the default configuration for betterleaks that they install beside it. This
# repository therefore runs what it ships. credential-scan-monthly.yml runs trufflehog as a
# second reader, once a month.
#
# The scanner is pinned by its version and by the SHA256 of its release archive for the runner,
# as checksums.txt of that release gives it. Change the two together, with the values that the
# script holds: a test compares them. The built-in rules belong to the version, so a new one can
# report what the old one did not. Run the scan and read its findings in the same change.
#
# On a pull request the job runs the script, the configuration, and .betterleaksignore of the
# pull request itself, so a change can leave out the finding that it adds. The scan guards
# against an accident, not against an author who means to get past it. It writes a warning in
# every run that says how much is left out.
#
# The ruleset for main requires this check, by the name of the job: "Credential scan". A job that
# is renamed stops reporting under the required name, and every pull request then waits for a
# check that never arrives. Change the name in the ruleset in the same step.
#
# Do not add a paths or a branches filter to the pull_request trigger, or an if: to the job. A
# pull request that a filter leaves out gets no check and cannot merge, and a job that is
# skipped counts as passed, so the pull request merges without the scan.
#
# The scan reads every branch and tag. A branch that holds a reported line therefore fails this
# check for every pull request, until the branch is deleted or the line is read and listed in
# .betterleaksignore.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The names of these values hold no word such as credential, key, or token. Beside a long
# value, a scanner takes such a name for the name of a key, and reports the hash below.
env:
  SCANNER_VERSION: '1.10.1'
  SCANNER_SHA256: 'c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e'

jobs:
  credentials:
    name: Credential scan
    runs-on: ubuntu-latest

    steps:
      # Every commit of every branch and tag. The default is the one commit that is built, and
      # the script refuses to scan such a checkout.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history and the files with betterleaks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scan = @{
              Scanner = 'betterleaks'
              Version = $env:SCANNER_VERSION
              Sha256 = $env:SCANNER_SHA256
              ConfigPath = './Templates/CredentialScan/betterleaks.toml'
          }
          ./Tools/Invoke-CredentialScan.ps1 @scan

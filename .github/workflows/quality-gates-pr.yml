name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell quality gate
    # Windows, so that the tests that start Windows PowerShell 5.1 run as well.
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm the PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
              throw "The tools in this repository need PowerShell 7.6. This runner has $($PSVersionTable.PSVersion)."
          }

      - name: Install build tools
        shell: pwsh
        run: |
          Install-PSResource -Name PSScriptAnalyzer -Version 1.25.0 -TrustRepository
          Install-PSResource -Name Pester -Version 6.2.0 -TrustRepository

      # The tests cover three things besides the tools' own behaviour: generated instruction
      # files match their sources, every code sample in them parses, and the repository's own
      # PowerShell passes Test-StandardsCompliance.ps1.
      - name: Run tests and the coverage gate
        shell: pwsh
        run: ./Tools/Invoke-QualityGate.ps1

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          # Help Markdown that PlatyPS generates is left out. Its syntax fence has no language
          # label and its module page puts the description on one line; both are rewritten on
          # every update, so they cannot be corrected by hand.
          globs: |
            **/*.md
            !**/docs/*/*.md
          config: '.markdownlint.json'

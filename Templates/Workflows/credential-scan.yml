name: Credential scan

# Scans every commit of every branch and tag, and the files of the checkout, for credentials.
# A credential that was committed stays in the repository after the commit that removes it, so
# the scan reads the history and not only the files.
#
# The scan is .github/scripts/Invoke-CredentialScan.ps1, which the PowerShell standards install
# and keep up to date. This workflow belongs to the repository: edit it freely.
#
# On a pull request the job runs the script, the configuration, and the ignore file of the pull
# request itself. A change can therefore leave out the finding that it adds, or change the scan.
# The scan guards against an accident, not against an author who means to get past it. It writes
# a warning in every run that says how much the ignore file and the configuration leave out.
# Where the repository has a second reader, require a review for those files and for this one.
#
# The scanner is pinned under env by its version and by the SHA256 of its release archive for
# the runner, as the checksum file of that release gives it. A release tag can be moved to other
# content, and the hash then no longer matches. Change the two together. The built-in rules belong
# to the version, so a new one can report what the old one did not: run the scan and read its
# findings in the same change.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The names of these values hold no word such as credential, key, or token. Beside a long
# value, a scanner takes such a name for the name of a key, and reports the hash below.
env:
  SCANNER: '{{Scanner}}'
  SCANNER_VERSION: '{{Version}}'
  SCANNER_SHA256: '{{Sha256}}'

jobs:
  credentials:
    name: Credential scan
    runs-on: ubuntu-latest

    steps:
      # Every commit of every branch and tag. The default is the one commit that is built, and
      # the script refuses to scan such a checkout.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the history and the files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scan = @{
              Scanner = $env:SCANNER
              Version = $env:SCANNER_VERSION
              Sha256 = $env:SCANNER_SHA256
          }
          ./.github/scripts/Invoke-CredentialScan.ps1 @scan
